name: Tap checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read

jobs:
  casks:
    runs-on: macos-latest
    env:
      HOMEBREW_DEVELOPER: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Update Homebrew and register this checkout
        run: |
          brew update
          tap_parent="$(brew --repository)/Library/Taps/gormanity"
          mkdir -p "$tap_parent"
          ln -s "$GITHUB_WORKSPACE" "$tap_parent/homebrew-tap"
          brew trust gormanity/tap
      - name: Check cask style
        run: brew style Casks
      - name: Audit all casks and their published artifacts
        run: brew audit --cask --strict --online --tap=gormanity/tap
      - name: Verify release discovery
        run: brew livecheck --cask --tap=gormanity/tap
